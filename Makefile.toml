[tasks.format]
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--", "--emit=files"]

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.build]
command = "cargo"
args = ["build"]
dependencies = ["clean"]

[tasks.test]
command = "cargo"
args = ["test"]
dependencies = ["clean"]

[tasks.clippy-watch]
command = "cargo"
args = ["watch", "-x", "clippy"]
install_crate = "cargo-watch"

[tasks.test-watch]
command = "cargo"
args = ["watch", "-x", "test", "-x", "build", "-x", "fmt"]
install_crate = "cargo-watch"
description = "Watches for changes and runs the my-flow task"
