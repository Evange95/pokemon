[package]
name = "pokemon"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.4", features = ["util"] }
dotenvy = "0.15"
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
